name: GEE monthly pipeline (rain / ET0 / land cover / rice paddy)

# Phase 2: pipeline จริงเขียนเสร็จแล้ว (pipeline/run_monthly.py ต่อยอดจาก
# 03_legacy_prototype/gee_pipeline.py) — ทดสอบ workflow_dispatch (manual) แล้ว 2026-08-21: รันผ่าน
# (47s), เขียนข้อมูลจริงครบ 18 หมู่บ้าน (rainfall_mm=197.4, et0_mm=36.1 สำหรับ 2026-07, ค่าสมเหตุสมผล
# กับฤดูฝนภาคเหนือ) — เปิด cron ให้รันอัตโนมัติทุกต้นเดือนแล้ว ตามเกณฑ์ผ่าน Phase 2 ข้อ 2
#
# 2026-08-23: เพิ่มโหมด backfill หลายเดือน (backfill_start/backfill_end) ให้รัน
# pipeline/backfill_monthly.py แทน — ใช้ตอนต้องการดึงข้อมูลย้อนหลังหลายเดือนติดกันโดยไม่ต้องกด
# "Run workflow" ทีละเดือน (ไม่ต้องตั้ง credential บนเครื่องตัวเองเลย ใช้ GitHub Secret ที่มีอยู่แล้ว
# รันบน GitHub-hosted runner ทั้งหมด)
#
# ต้องตั้ง GitHub Secret ก่อนรัน (Settings → Secrets and variables → Actions):
#   EE_SERVICE_ACCOUNT_KEY — เนื้อหา JSON เต็มของ GEE service account (ผูกกับ GCP project ที่เปิด
#                            ใช้ Earth Engine API แล้ว)
#   DATABASE_URL           — เหมือนกับที่ตั้งใน Render (Supabase Transaction pooler)
#
# 2026-09-03: run #22 (cron ต้นเดือน 1 ก.ย.) fail ที่ step "รัน pipeline" — ee.EEException:
# "Dictionary.get: Dictionary does not contain key: 'precipitation'." ใน compute_monthly_rainfall()
# (pipeline/rainfall_et0.py) สาเหตุคือ CHIRPS Daily (UCSB-CHG/CHIRPS/DAILY) เวอร์ชัน final ที่ asset
# นี้ใช้ ออกช้ากว่าสิ้นเดือนจริงประมาณ 3 สัปดาห์ — ตอนรันวันที่ 1 ของเดือน (คำนวณเดือนก่อนหน้าซึ่งเพิ่ง
# จบไปแค่ 1 วัน) ข้อมูล CHIRPS final ของเดือนนั้นยังไม่ถูกเผยแพร่ .filterDate() เลยได้ ImageCollection
# ว่าง .sum() บน collection ว่างจึงได้ image ที่ไม่มี band "precipitation" เลย ทำให้ .get() พัง (ไม่ใช่
# บั๊กชั่วคราว จะพังซ้ำทุกต้นเดือน) — แก้โดยเลื่อน cron ไปท้ายเดือนแทน (ยังคำนวณ "เดือนก่อนหน้า" เหมือน
# เดิม แต่รอให้ CHIRPS final มีเวลาออกก่อน ~28 วัน ปลอดภัยกว่า 3 สัปดาห์ที่ CHIRPS ใช้จริง)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "รันเดือนเดียว — ปี (ค.ศ.) เว้นว่างทั้งคู่ = เดือนก่อนหน้าอัตโนมัติ (ไม่ใช้ร่วมกับ backfill_start/backfill_end ด้านล่าง)"
        required: false
      month:
        description: "รันเดือนเดียว — เดือน (1-12)"
        required: false
      backfill_start:
        description: "Backfill หลายเดือนติดกัน — เดือนเริ่ม รูปแบบ YYYY-MM เช่น 2025-06 (ใส่คู่กับ backfill_end ด้านล่าง ถ้าใส่ช่องนี้จะไม่สนใจ year/month ด้านบน)"
        required: false
      backfill_end:
        description: "Backfill หลายเดือนติดกัน — เดือนสิ้นสุด รูปแบบ YYYY-MM เช่น 2026-06 (รวมเดือนนี้ด้วย)"
        required: false
  schedule:
    - cron: "0 1 28 * *"  # วันที่ 28 ของเดือน 08:00 น. เวลาไทย (UTC+7) — คำนวณเดือนก่อนหน้า
                          # (เลื่อนจากวันที่ 1 เพราะ CHIRPS final lag ~3 สัปดาห์ ดูหมายเหตุ 2026-09-03 ด้านบน)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ติดตั้ง dependencies
        run: pip install -r pipeline/requirements.txt
      - name: รัน pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_start }}" ] && [ -n "${{ github.event.inputs.backfill_end }}" ]; then
            START_YEAR=$(echo "${{ github.event.inputs.backfill_start }}" | cut -d- -f1)
            START_MONTH=$(echo "${{ github.event.inputs.backfill_start }}" | cut -d- -f2)
            END_YEAR=$(echo "${{ github.event.inputs.backfill_end }}" | cut -d- -f1)
            END_MONTH=$(echo "${{ github.event.inputs.backfill_end }}" | cut -d- -f2)
            echo "Backfill โหมด: $START_YEAR-$START_MONTH ถึง $END_YEAR-$END_MONTH"
            python pipeline/backfill_monthly.py "$START_YEAR" "$START_MONTH" "$END_YEAR" "$END_MONTH"
          elif [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.month }}" ]; then
            python pipeline/run_monthly.py "${{ github.event.inputs.year }}" "${{ github.event.inputs.month }}"
          else
            python pipeline/run_monthly.py
          fi
